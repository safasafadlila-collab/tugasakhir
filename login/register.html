<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Safa</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<section>
    <div class="login-box">
        <form id="registerForm">
            <h2>Register</h2>
            
            <div class="input-box">
                <span class="icon"><ion-icon name="person"></ion-icon></span>
                <input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>
            
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" id="password" required>
                <label>Password</label>
            </div>
            
            <div id="alertBox" class="alert" style="display:none; color:white; background:#e44e4e; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center;"></div>
            
            <button type="submit">Daftar Akun</button>
            
            <div class="register-link">
                <p>Sudah punya akun?
                    <a href="index.html">Login di sini</a>
                </p>
            </div>
        </form>
    </div>
</section>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script src="js/register.js"></script>

</body>
</html>
